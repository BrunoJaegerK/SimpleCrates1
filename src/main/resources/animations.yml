animations:
  # Modo de animación: classic o roulette
  mode: "roulette"

  # Animación clásica
  classic:
    enabled: true
    duration: 60

    particles:
      enabled: true
      type: "flame"
      radius: 0.8
      height: 1.0

    sounds:
      enabled: true
      opening: "RANDOM_CHESTOPEN"
      volume: 1.0
      pitch-start: 0.8
      pitch-end: 1.8

  # Animación de ruleta
  roulette:
    enabled: true
    duration: 100

    sounds:
      enabled: true
      spin: "NOTE"
      finish: "LEVEL_UP"
      volume: 1.00